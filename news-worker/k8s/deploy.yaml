apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-worker
  namespace: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: news-worker
  template:
    metadata:
      labels:
        app: news-worker
    spec:
      serviceAccountName: news-worker
      containers:
      - name: news-worker
        image: localhost:5000/news-worker:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: TEMPORAL_ADDRESS
          value: "temporal-frontend:7233"
        - name: KEYCLOAK_URL
          value: "http://keycloak.keycloak.svc.cluster.local"
        - name: KEYCLOAK_REALM
          value: "homekube"
        - name: KEYCLOAK_CLIENT_ID
          value: "news-worker"
        - name: KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: news-worker-keycloak
              key: client-secret
              optional: true
        - name: WORKFLOWS_DB_USER
          valueFrom:
            secretKeyRef:
              name: workflows-db-app
              key: username
        - name: WORKFLOWS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: workflows-db-app
              key: password
        - name: DATABASE_URL
          value: "postgres://$(WORKFLOWS_DB_USER):$(WORKFLOWS_DB_PASSWORD)@workflows-db-rw.temporal.svc.cluster.local:5432/workflows"
        - name: WHATSAPP_URL
          value: "http://whatsapp.default.svc.cluster.local"
        - name: CLAUDE_CODE_NAMESPACE
          value: "default"
        - name: CLAUDE_CODE_LABEL
          value: "app=claude-code"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
