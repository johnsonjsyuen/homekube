apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ocr-server
  template:
    metadata:
      labels:
        app: ocr-server
    spec:
      containers:
        - name: ocr-server
          image: localhost:5000/ocr-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: KEYCLOAK_URL
              value: "http://keycloak.keycloak.svc.cluster.local"
            - name: KEYCLOAK_REALM
              value: "homekube"
            - name: OCR_LANG
              value: "en"
            - name: OCR_MODEL_DIR
              value: "/models"
          volumeMounts:
            - name: ocr-models
              mountPath: /models
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10
      volumes:
        - name: ocr-models
          persistentVolumeClaim:
            claimName: ocr-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ocr-models
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ocr-server
  namespace: default
spec:
  selector:
    app: ocr-server
  ports:
    - port: 80
      targetPort: 3000
