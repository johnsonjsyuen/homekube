apiVersion: v1
kind: Namespace
metadata:
  name: dictate-asr
  labels:
    app.kubernetes.io/part-of: dictate-asr
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-asr
  namespace: dictate-asr
  labels:
    app.kubernetes.io/name: qwen-asr
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qwen-asr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen-asr
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: johnson-minipc
      terminationGracePeriodSeconds: 130
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qwen-asr
          image: localhost:5000/dictate-qwen-asr@sha256:b3b29e47ca8a05f8a7275a6b7113c2248e289e59aaca79bbb91c0320cf432473
          imagePullPolicy: IfNotPresent
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8767"
            - name: QWEN_RT_MODEL_NAME
              value: Qwen/Qwen3-ASR-1.7B
            - name: QWEN_RT_MODEL_ID
              value: Qwen/Qwen3-ASR-1.7B
            - name: QWEN_RT_MODEL_PATH
              value: /models/snapshots/7278e1e70fe206f11671096ffdd38061171dd6e5
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: QWEN_RT_LOCAL_FILES_ONLY
              value: "true"
            - name: QWEN_RT_IDLE_UNLOAD_SECONDS
              value: "120"
            - name: OMP_NUM_THREADS
              value: "8"
            - name: MKL_NUM_THREADS
              value: "8"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
          ports:
            - name: http
              containerPort: 8767
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: 10Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: "8"
              memory: 10Gi
              ephemeral-storage: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import json, os, urllib.request
                  from pathlib import Path
                  root = Path(os.environ["QWEN_RT_MODEL_PATH"])
                  required = ["config.json", "preprocessor_config.json", "tokenizer_config.json", "chat_template.json", "merges.txt", "vocab.json"]
                  index = json.loads((root / "model.safetensors.index.json").read_text())
                  required += sorted(set(index["weight_map"].values()))
                  for name in required:
                      with (root / name).open("rb") as stream:
                          assert stream.read(1), name
                  with urllib.request.urlopen("http://127.0.0.1:8767/health", timeout=2) as response:
                      assert response.status == 200
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: model
              mountPath: /models
              readOnly: true
            - name: cache
              mountPath: /app/.cache
            - name: runtime
              mountPath: /app/.runtime
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model
          hostPath:
            path: /home/johnson/.cache/huggingface/hub/models--Qwen--Qwen3-ASR-1.7B
            type: Directory
        - name: cache
          emptyDir:
            sizeLimit: 1Gi
        - name: runtime
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qwen-asr
  namespace: dictate-asr
spec:
  type: ClusterIP
  # kube-proxy routes the node's existing Tailscale address to the isolated pod.
  externalIPs:
    - 100.87.216.102
  selector:
    app.kubernetes.io/name: qwen-asr
  ports:
    - name: http
      port: 8767
      targetPort: http
      protocol: TCP
