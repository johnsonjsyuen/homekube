apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflared-updater
  namespace: cloudflare
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudflared-updater
  namespace: cloudflare
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cloudflared-deployment"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudflared-updater
  namespace: cloudflare
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudflared-updater
subjects:
  - kind: ServiceAccount
    name: cloudflared-updater
    namespace: cloudflare
---
# The cloudflared image is tagged "latest" with imagePullPolicy: Always, so a
# pod recreation is enough to pick up a new release. Kubernetes never re-pulls
# on its own, and cloudflared's built-in updater is disabled in containers, so
# this job triggers a rolling restart once a day.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloudflared-auto-update
  namespace: cloudflare
spec:
  schedule: "17 4 * * *"
  timeZone: Australia/Sydney
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: cloudflared-updater
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: kubectl
              image: registry.k8s.io/kubectl:v1.33.6
              imagePullPolicy: IfNotPresent
              command:
                - kubectl
                - rollout
                - restart
                - deployment/cloudflared-deployment
                - --namespace
                - cloudflare
              env:
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
