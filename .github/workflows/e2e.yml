name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress run
        id: cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: homepage
          start: yarn dev
          wait-on: 'http://localhost:5173'
          wait-on-timeout: 60

      - name: Show failing test names
        if: failure()
        run: |
          find homepage/cypress/screenshots -name '*.png' -type f 2>/dev/null | while read f; do
            echo "::error::Failed test screenshot: $f"
          done

      - name: Upload Cypress artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-artifacts
          path: |
            homepage/cypress/screenshots
            homepage/cypress/videos

  homepage-app-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: homepage-app/yarn.lock

      - name: Install dependencies
        run: |
          cd homepage-app
          yarn install --frozen-lockfile

      - name: Run tests
        run: |
          cd homepage-app
          yarn test

  tts-integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run TTS Integration Test
        run: |
          cd text-to-speech
          cargo test --test integration_test

  stt-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: speech-to-text

      - name: Run STT unit tests
        run: |
          cd speech-to-text
          cargo test --bins

  tts-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: text-to-speech

      - name: Run TTS unit tests
        run: |
          cd text-to-speech
          cargo test --bins
