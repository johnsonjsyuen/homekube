name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: homepage/package-lock.json

      - name: Install dependencies
        run: |
          cd homepage
          npm ci

      - name: Start server and run tests
        run: |
          cd homepage
          npm run dev &
          npx wait-on http://localhost:5173 --timeout 60000
          npm run cy:run

  tts-integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run TTS Integration Test
        run: |
          cd text-to-speech
          cargo test --test integration_test

  stt-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: speech-to-text

      - name: Run STT unit tests
        run: |
          cd speech-to-text
          cargo test --bins

  tts-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: text-to-speech

      - name: Run TTS unit tests
        run: |
          cd text-to-speech
          cargo test --bins
