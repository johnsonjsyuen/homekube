name: Task Worker Build

on:
  push:
    paths:
      - 'task-worker/**'
      - '.github/workflows/task-worker-build.yml'
  pull_request:
    paths:
      - 'task-worker/**'
      - '.github/workflows/task-worker-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: task-worker

      - name: Type check
        run: bunx tsc --noEmit
        working-directory: task-worker

      - name: Build binaries
        working-directory: task-worker
        run: |
          mkdir -p dist

          # Linux x64
          bun build src/index.ts --compile --target=bun-linux-x64 --outfile dist/task-worker-linux-x64

          # Linux ARM64
          bun build src/index.ts --compile --target=bun-linux-arm64 --outfile dist/task-worker-linux-arm64

          # Windows x64
          bun build src/index.ts --compile --target=bun-windows-x64 --outfile dist/task-worker-windows-x64.exe

          # macOS x64
          bun build src/index.ts --compile --target=bun-darwin-x64 --outfile dist/task-worker-darwin-x64

          # macOS ARM64 (Apple Silicon)
          bun build src/index.ts --compile --target=bun-darwin-arm64 --outfile dist/task-worker-darwin-arm64

          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: task-worker-binaries
          path: task-worker/dist/
          retention-days: 30
