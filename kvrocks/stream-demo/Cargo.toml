[package]
name = "kvrocks-stream-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
redis = { version = "0.25", features = ["tokio-comp"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
