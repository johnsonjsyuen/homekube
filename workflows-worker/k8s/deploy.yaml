apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflows-worker
  namespace: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workflows-worker
  template:
    metadata:
      labels:
        app: workflows-worker
    spec:
      containers:
      - name: workflows-worker
        image: localhost:5000/workflows-worker:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: TEMPORAL_ADDRESS
          value: "temporal-frontend:7233"
        - name: KEYCLOAK_URL
          value: "https://auth.johnsonyuen.com"
        - name: KEYCLOAK_REALM
          value: "homekube"
        - name: KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: workflows-worker-keycloak
              key: client-secret
              optional: true
        - name: WORKFLOWS_WORKER_DB_USER
          valueFrom:
            secretKeyRef:
              name: workflows-worker-db-app
              key: username
        - name: WORKFLOWS_WORKER_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: workflows-worker-db-app
              key: password
        - name: WHATSAPP_URL
          value: "http://whatsapp.default.svc.cluster.local"
        - name: NATS_URL
          value: "nats://nats.default.svc.cluster.local:4222"
        - name: CLAUDE_API_URL
          value: "http://claude-code-api.default.svc.cluster.local"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 3
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 2
          periodSeconds: 10
