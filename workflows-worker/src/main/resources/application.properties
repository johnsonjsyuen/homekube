# Server
quarkus.http.port=3000

# Jackson
quarkus.jackson.property-naming-strategy=SNAKE_CASE

# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://workflows-worker-db-rw.temporal.svc.cluster.local:5432/workflows_worker
quarkus.datasource.username=${WORKFLOWS_WORKER_DB_USER}
quarkus.datasource.password=${WORKFLOWS_WORKER_DB_PASSWORD}

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# OIDC (Keycloak) - bearer token validation for incoming requests
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://keycloak.keycloak.svc.cluster.local}/realms/${KEYCLOAK_REALM:homekube}
quarkus.oidc.client-id=workflows-worker
quarkus.oidc.token.issuer=any
quarkus.oidc.token.audience=any
quarkus.oidc.token.principal-claim=preferred_username

# OIDC Client (for service-to-service calls to WhatsApp API)
quarkus.oidc-client.auth-server-url=${KEYCLOAK_URL:http://keycloak.keycloak.svc.cluster.local}/realms/${KEYCLOAK_REALM:homekube}
quarkus.oidc-client.client-id=workflows-worker
quarkus.oidc-client.credentials.secret=${KEYCLOAK_CLIENT_SECRET}
quarkus.oidc-client.grant.type=client

# NATS
nats.url=${NATS_URL:nats://nats.default.svc.cluster.local:4222}

# Serve health and metrics at /health and /metrics (not under /q)
quarkus.http.non-application-root-path=/

# Temporal (Quarkiverse extension)
quarkus.temporal.connection.target=${TEMPORAL_ADDRESS:temporal-frontend:7233}
quarkus.temporal.worker.task-queue=workflows-worker-queue
quarkus.temporal.health.enabled=false

# Custom properties
app.claude-api.url=${CLAUDE_API_URL:http://claude-code-api.default.svc.cluster.local}
app.whatsapp.url=${WHATSAPP_URL:http://whatsapp.default.svc.cluster.local}
app.max-jobs-per-user=10

# Native image
quarkus.native.resources.includes=db/migration/**
quarkus.native.additional-build-args=--initialize-at-run-time=io.nats.client.support.RandomUtils\\,io.nats.client.NUID\\,net.i2p.crypto.eddsa\\,io.nats.client.NKey\\,io.nats.client.impl.FileAuthHandler,-J--add-exports=java.base/sun.security.x509=ALL-UNNAMED

# CORS (Tauri app origins)
quarkus.http.cors=true
quarkus.http.cors.origins=http://tauri.localhost,https://tauri.localhost,tauri://localhost,http://localhost:1420
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.http.cors.exposed-headers=Content-Type
