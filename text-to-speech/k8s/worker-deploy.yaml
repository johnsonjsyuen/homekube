apiVersion: apps/v1
kind: Deployment
metadata:
  name: tts-worker
  namespace: default
spec:
  # replicas intentionally omitted — managed by KEDA ScaledObject
  selector:
    matchLabels:
      app: tts-worker
  template:
    metadata:
      labels:
        app: tts-worker
    spec:
      containers:
      - name: tts-worker
        image: localhost:5000/text-to-speech:latest
        imagePullPolicy: Always
        command: ["tts-worker"]
        ports:
        - containerPort: 3001
        env:
        - name: STORAGE_PATH
          value: "/app/storage"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: text-to-speech-db-app
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: text-to-speech-db-app
              key: password
        - name: DB_HOST
          value: "text-to-speech-db-rw"
        - name: DB_NAME
          value: "text_to_speech"
        - name: DATABASE_URL
          value: "postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):5432/$(DB_NAME)"
        - name: KOKORO_MODEL_DIR
          value: "/app/models"
        - name: NATS_URL
          value: "nats://nats:4222"
        volumeMounts:
        - name: models
          mountPath: /app/models
          readOnly: true
        - name: storage
          mountPath: /app/storage
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "3Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: tts-models
      - name: storage
        persistentVolumeClaim:
          claimName: text-to-speech-storage
