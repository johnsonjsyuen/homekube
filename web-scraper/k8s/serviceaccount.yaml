apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-scraper
  namespace: temporal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: web-scraper-pod-exec
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: web-scraper-pod-exec
  namespace: default
subjects:
- kind: ServiceAccount
  name: web-scraper
  namespace: temporal
roleRef:
  kind: Role
  name: web-scraper-pod-exec
  apiGroup: rbac.authorization.k8s.io
