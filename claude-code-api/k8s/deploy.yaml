apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-code-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claude-code-api
  template:
    metadata:
      labels:
        app: claude-code-api
    spec:
      volumes:
      - name: claude-config
        persistentVolumeClaim:
          claimName: claude-code-config
      - name: git-workspace
        persistentVolumeClaim:
          claimName: claude-code-workspace
      initContainers:
      - name: fix-permissions
        image: busybox
        command: ["sh", "-c", "chown -R 1000:1000 /workspace"]
        volumeMounts:
        - name: git-workspace
          mountPath: /workspace
      containers:
      - name: claude-code-api
        image: localhost:5000/claude-code-api:latest
        workingDir: /workspace
        ports:
        - containerPort: 3000
        env:
        - name: RUST_LOG
          value: "info"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: claude-chat-db-app
              key: username
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: claude-chat-db-app
              key: password
        - name: DATABASE_URL
          value: "postgres://$(DB_USER):$(DB_PASS)@claude-chat-db-rw:5432/claude_chat"
        - name: GH_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-token
              key: token
        - name: GIT_AUTHOR_NAME
          value: "Claude Code"
        - name: GIT_AUTHOR_EMAIL
          value: "claude@johnsonyuen.com"
        - name: GIT_COMMITTER_NAME
          value: "Claude Code"
        - name: GIT_COMMITTER_EMAIL
          value: "claude@johnsonyuen.com"
        volumeMounts:
        - name: claude-config
          mountPath: /home/node/.claude
        - name: git-workspace
          mountPath: /workspace
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: claude-code-api
  namespace: default
spec:
  selector:
    app: claude-code-api
  ports:
  - name: http
    port: 80
    targetPort: 3000
