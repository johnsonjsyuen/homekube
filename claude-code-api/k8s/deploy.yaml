apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-code-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claude-code-api
  template:
    metadata:
      labels:
        app: claude-code-api
    spec:
      volumes:
      - name: claude-config
        persistentVolumeClaim:
          claimName: claude-code-config
      containers:
      - name: claude-code-api
        image: localhost:5000/claude-code-api:latest
        ports:
        - containerPort: 3000
        env:
        - name: RUST_LOG
          value: "info"
        volumeMounts:
        - name: claude-config
          mountPath: /root/.claude
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: claude-code-api
  namespace: default
spec:
  selector:
    app: claude-code-api
  ports:
  - name: http
    port: 80
    targetPort: 3000
