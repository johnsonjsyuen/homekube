apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: claude-chat-db
  namespace: default
spec:
  instances: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  storage:
    size: 2Gi
  bootstrap:
    initdb:
      database: claude_chat
      owner: claude_chat
