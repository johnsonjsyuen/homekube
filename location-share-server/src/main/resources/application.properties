# Server
quarkus.http.port=3000

# CORS (Tauri app origins)
quarkus.http.cors=true
quarkus.http.cors.origins=http://tauri.localhost,https://tauri.localhost,tauri://localhost,http://localhost:1420
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.http.cors.exposed-headers=Content-Type

# Database
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://location-share-db-rw.default.svc.cluster.local:5432/location_share
%prod.quarkus.datasource.username=${LOCATION_SHARE_DB_USER}
%prod.quarkus.datasource.password=${LOCATION_SHARE_DB_PASSWORD}

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# OIDC (Keycloak) - bearer token validation
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://keycloak.keycloak.svc.cluster.local}/realms/${KEYCLOAK_REALM:homekube}
quarkus.oidc.client-id=location-share-server
quarkus.oidc.token.issuer=any
quarkus.oidc.token.audience=any
quarkus.oidc.token.principal-claim=sub

# Health and metrics at /health and /metrics (not under /q)
quarkus.http.non-application-root-path=/

# Native image
quarkus.native.resources.includes=db/migration/**
