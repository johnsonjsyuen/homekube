# Helm values for kube-prometheus-stack (homelab-sized)
# Chart: prometheus-community/kube-prometheus-stack

# Prometheus settings
prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 2Gi
    # Watch ServiceMonitors in ALL namespaces (services in default + temporal)
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}
    # Watch PodMonitors in ALL namespaces (CNPG PodMonitors)
    podMonitorNamespaceSelector: {}
    podMonitorSelector: {}

# Grafana settings
grafana:
  persistence:
    enabled: true
    size: 5Gi
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana"
      serve_from_sub_path: true

# Disable AlertManager (homelab, not needed yet)
alertmanager:
  enabled: false

# Disable components not accessible on k3s
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
