apiVersion: oss.grafana.crossplane.io/v1alpha1
kind: Dashboard
metadata:
  name: overview
spec:
  forProvider:
    folderRef:
      name: homekube
    configJson: |
      {
        "title": "Homekube Overview",
        "uid": "homekube-overview",
        "tags": ["homekube"],
        "timezone": "browser",
        "refresh": "30s",
        "time": { "from": "now-1h", "to": "now" },
        "panels": [
          {
            "id": 1,
            "title": "Text-to-Speech",
            "type": "stat",
            "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
            "targets": [
              {
                "expr": "up{job=\"text-to-speech\"}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "mappings": [
                  { "type": "value", "options": { "0": { "text": "Down", "color": "red" }, "1": { "text": "Up", "color": "green" } } }
                ],
                "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
              }
            },
            "options": { "colorMode": "background", "graphMode": "none", "textMode": "auto" }
          },
          {
            "id": 2,
            "title": "Speech-to-Text",
            "type": "stat",
            "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
            "targets": [
              {
                "expr": "up{job=\"speech-to-text\"}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "mappings": [
                  { "type": "value", "options": { "0": { "text": "Down", "color": "red" }, "1": { "text": "Up", "color": "green" } } }
                ],
                "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
              }
            },
            "options": { "colorMode": "background", "graphMode": "none", "textMode": "auto" }
          },
          {
            "id": 3,
            "title": "WhatsApp",
            "type": "stat",
            "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
            "targets": [
              {
                "expr": "up{job=\"whatsapp\"}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "mappings": [
                  { "type": "value", "options": { "0": { "text": "Down", "color": "red" }, "1": { "text": "Up", "color": "green" } } }
                ],
                "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
              }
            },
            "options": { "colorMode": "background", "graphMode": "none", "textMode": "auto" }
          },
          {
            "id": 4,
            "title": "News Worker",
            "type": "stat",
            "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
            "targets": [
              {
                "expr": "up{job=\"news-worker\"}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "mappings": [
                  { "type": "value", "options": { "0": { "text": "Down", "color": "red" }, "1": { "text": "Up", "color": "green" } } }
                ],
                "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
              }
            },
            "options": { "colorMode": "background", "graphMode": "none", "textMode": "auto" }
          },
          {
            "id": 5,
            "title": "TTS Jobs (24h)",
            "type": "stat",
            "gridPos": { "h": 4, "w": 6, "x": 0, "y": 4 },
            "targets": [
              {
                "expr": "sum(increase(tts_jobs_total[24h]))",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] }
              }
            },
            "options": { "colorMode": "background", "graphMode": "none", "textMode": "auto" }
          },
          {
            "id": 6,
            "title": "Transcriptions (24h)",
            "type": "stat",
            "gridPos": { "h": 4, "w": 6, "x": 6, "y": 4 },
            "targets": [
              {
                "expr": "sum(increase(stt_transcriptions_total[24h]))",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] }
              }
            },
            "options": { "colorMode": "background", "graphMode": "none", "textMode": "auto" }
          },
          {
            "id": 7,
            "title": "WhatsApp Messages (24h)",
            "type": "stat",
            "gridPos": { "h": 4, "w": 6, "x": 12, "y": 4 },
            "targets": [
              {
                "expr": "sum(increase(whatsapp_messages_sent_total[24h])) + sum(increase(whatsapp_messages_received_total[24h]))",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] }
              }
            },
            "options": { "colorMode": "background", "graphMode": "none", "textMode": "auto" }
          },
          {
            "id": 8,
            "title": "Workflow Runs (24h)",
            "type": "stat",
            "gridPos": { "h": 4, "w": 6, "x": 18, "y": 4 },
            "targets": [
              {
                "expr": "sum(increase(workflow_runs_total[24h]))",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] }
              }
            },
            "options": { "colorMode": "background", "graphMode": "none", "textMode": "auto" }
          }
        ],
        "schemaVersion": 39
      }
