apiVersion: oss.grafana.crossplane.io/v1alpha1
kind: Dashboard
metadata:
  name: whatsapp
spec:
  forProvider:
    folderRef:
      name: homekube
    configJson: |
      {
        "title": "WhatsApp",
        "uid": "homekube-whatsapp",
        "tags": ["homekube", "whatsapp"],
        "timezone": "browser",
        "refresh": "30s",
        "time": { "from": "now-1h", "to": "now" },
        "panels": [
          {
            "id": 1,
            "title": "Active Sessions",
            "type": "gauge",
            "gridPos": { "h": 8, "w": 6, "x": 0, "y": 0 },
            "targets": [
              {
                "expr": "whatsapp_active_sessions",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "min": 0,
                "max": 10,
                "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 5 }, { "color": "red", "value": 8 }] }
              }
            }
          },
          {
            "id": 2,
            "title": "Session Connects (24h)",
            "type": "stat",
            "gridPos": { "h": 8, "w": 6, "x": 6, "y": 0 },
            "targets": [
              {
                "expr": "sum by (status) (increase(whatsapp_session_connects_total[24h]))",
                "legendFormat": "{{status}}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] }
              }
            },
            "options": { "colorMode": "background", "graphMode": "none", "textMode": "auto" }
          },
          {
            "id": 3,
            "title": "Messages Sent vs Received",
            "type": "timeseries",
            "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
            "targets": [
              {
                "expr": "rate(whatsapp_messages_sent_total[5m])",
                "legendFormat": "sent",
                "refId": "A"
              },
              {
                "expr": "rate(whatsapp_messages_received_total[5m])",
                "legendFormat": "received",
                "refId": "B"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "ops",
                "custom": { "fillOpacity": 20 }
              }
            }
          },
          {
            "id": 4,
            "title": "Messages Total (24h)",
            "type": "stat",
            "gridPos": { "h": 8, "w": 6, "x": 0, "y": 8 },
            "targets": [
              {
                "expr": "sum(increase(whatsapp_messages_sent_total[24h]))",
                "legendFormat": "sent",
                "refId": "A"
              },
              {
                "expr": "sum(increase(whatsapp_messages_received_total[24h]))",
                "legendFormat": "received",
                "refId": "B"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] }
              }
            },
            "options": { "colorMode": "background", "graphMode": "none", "textMode": "auto" }
          },
          {
            "id": 5,
            "title": "HTTP Request Rate by Status",
            "type": "timeseries",
            "gridPos": { "h": 8, "w": 9, "x": 6, "y": 8 },
            "targets": [
              {
                "expr": "sum by (status) (rate(http_requests_total{job=\"whatsapp\"}[5m]))",
                "legendFormat": "{{status}}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "reqps",
                "custom": { "fillOpacity": 20, "stacking": { "mode": "normal" } }
              }
            }
          },
          {
            "id": 6,
            "title": "HTTP Latency p95",
            "type": "timeseries",
            "gridPos": { "h": 8, "w": 9, "x": 15, "y": 8 },
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum by (le, path) (rate(http_request_duration_seconds_bucket{job=\"whatsapp\"}[5m])))",
                "legendFormat": "{{path}}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "s",
                "custom": { "fillOpacity": 10 }
              }
            }
          }
        ],
        "schemaVersion": 39
      }
