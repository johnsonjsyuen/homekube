apiVersion: oss.grafana.crossplane.io/v1alpha1
kind: Dashboard
metadata:
  name: speech-to-text
spec:
  forProvider:
    folderRef:
      name: homekube
    configJson: |
      {
        "title": "Speech-to-Text",
        "uid": "homekube-stt",
        "tags": ["homekube", "stt"],
        "timezone": "browser",
        "refresh": "30s",
        "time": { "from": "now-6h", "to": "now" },
        "panels": [
          {
            "id": 1,
            "title": "Active Sessions",
            "type": "gauge",
            "gridPos": { "h": 8, "w": 6, "x": 0, "y": 0 },
            "targets": [
              {
                "expr": "stt_active_sessions",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "min": 0,
                "max": 10,
                "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 5 }, { "color": "red", "value": 8 }] }
              }
            }
          },
          {
            "id": 2,
            "title": "Transcriptions per Hour",
            "type": "timeseries",
            "gridPos": { "h": 8, "w": 18, "x": 6, "y": 0 },
            "targets": [
              {
                "expr": "round(increase(stt_transcriptions_total[1h]))",
                "legendFormat": "transcriptions",
                "interval": "1h",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "decimals": 0,
                "custom": {
                  "drawStyle": "bars",
                  "barAlignment": 0,
                  "fillOpacity": 80
                }
              }
            }
          },
          {
            "id": 3,
            "title": "Transcription Duration",
            "type": "timeseries",
            "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
            "targets": [
              {
                "expr": "histogram_quantile(0.50, sum by (le) (rate(stt_transcription_duration_seconds_bucket[5m])))",
                "legendFormat": "p50",
                "refId": "A"
              },
              {
                "expr": "histogram_quantile(0.95, sum by (le) (rate(stt_transcription_duration_seconds_bucket[5m])))",
                "legendFormat": "p95",
                "refId": "B"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "s",
                "custom": { "fillOpacity": 10 }
              }
            }
          },
          {
            "id": 4,
            "title": "Audio Segments per Hour",
            "type": "timeseries",
            "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
            "targets": [
              {
                "expr": "round(increase(stt_audio_segments_total[1h]))",
                "legendFormat": "segments",
                "interval": "1h",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "decimals": 0,
                "custom": {
                  "drawStyle": "bars",
                  "barAlignment": 0,
                  "fillOpacity": 80
                }
              }
            }
          },
          {
            "id": 5,
            "title": "HTTP Requests per Hour",
            "type": "timeseries",
            "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
            "targets": [
              {
                "expr": "round(sum by (status) (increase(axum_http_requests_total{job=\"speech-to-text\"}[1h])))",
                "legendFormat": "{{status}}",
                "interval": "1h",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "decimals": 0,
                "custom": {
                  "drawStyle": "bars",
                  "barAlignment": 0,
                  "fillOpacity": 80,
                  "stacking": { "mode": "normal" }
                }
              }
            }
          },
          {
            "id": 6,
            "title": "HTTP Latency p95",
            "type": "timeseries",
            "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum by (le, endpoint) (rate(axum_http_requests_duration_seconds_bucket{job=\"speech-to-text\"}[5m])))",
                "legendFormat": "{{endpoint}}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "s",
                "custom": { "fillOpacity": 10 }
              }
            }
          }
        ],
        "schemaVersion": 39
      }
