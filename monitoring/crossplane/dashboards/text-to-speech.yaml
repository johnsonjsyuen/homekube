apiVersion: oss.grafana.crossplane.io/v1alpha1
kind: Dashboard
metadata:
  name: text-to-speech
spec:
  forProvider:
    folderRef:
      name: homekube
    configJson: |
      {
        "title": "Text-to-Speech",
        "uid": "homekube-tts",
        "tags": ["homekube", "tts"],
        "timezone": "browser",
        "refresh": "30s",
        "time": { "from": "now-6h", "to": "now" },
        "panels": [
          {
            "id": 1,
            "title": "Active Jobs",
            "type": "gauge",
            "gridPos": { "h": 8, "w": 6, "x": 0, "y": 0 },
            "targets": [
              {
                "expr": "tts_active_jobs",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "min": 0,
                "max": 10,
                "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 5 }, { "color": "red", "value": 8 }] }
              }
            }
          },
          {
            "id": 2,
            "title": "Jobs per Hour",
            "type": "timeseries",
            "gridPos": { "h": 8, "w": 18, "x": 6, "y": 0 },
            "targets": [
              {
                "expr": "round(sum by (status) (increase(tts_jobs_total[1h])))",
                "legendFormat": "{{status}}",
                "interval": "1h",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "decimals": 0,
                "custom": {
                  "drawStyle": "bars",
                  "barAlignment": 0,
                  "fillOpacity": 80,
                  "stacking": { "mode": "normal" }
                }
              }
            }
          },
          {
            "id": 3,
            "title": "Generation Duration",
            "type": "timeseries",
            "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
            "targets": [
              {
                "expr": "histogram_quantile(0.50, sum by (le) (rate(tts_generation_duration_seconds_bucket[5m])))",
                "legendFormat": "p50",
                "refId": "A"
              },
              {
                "expr": "histogram_quantile(0.95, sum by (le) (rate(tts_generation_duration_seconds_bucket[5m])))",
                "legendFormat": "p95",
                "refId": "B"
              },
              {
                "expr": "histogram_quantile(0.99, sum by (le) (rate(tts_generation_duration_seconds_bucket[5m])))",
                "legendFormat": "p99",
                "refId": "C"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "s",
                "custom": { "fillOpacity": 10 }
              }
            }
          },
          {
            "id": 4,
            "title": "HTTP Requests per Hour",
            "type": "timeseries",
            "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
            "targets": [
              {
                "expr": "round(sum by (status) (increase(axum_http_requests_total{job=\"text-to-speech\"}[1h])))",
                "legendFormat": "{{status}}",
                "interval": "1h",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "decimals": 0,
                "custom": {
                  "drawStyle": "bars",
                  "barAlignment": 0,
                  "fillOpacity": 80,
                  "stacking": { "mode": "normal" }
                }
              }
            }
          },
          {
            "id": 5,
            "title": "HTTP Latency p95",
            "type": "timeseries",
            "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum by (le, endpoint) (rate(axum_http_requests_duration_seconds_bucket{job=\"text-to-speech\"}[5m])))",
                "legendFormat": "{{endpoint}}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "s",
                "custom": { "fillOpacity": 10 }
              }
            }
          },
          {
            "id": 6,
            "title": "HTTP Errors per Hour",
            "type": "timeseries",
            "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
            "targets": [
              {
                "expr": "round(sum by (status) (increase(axum_http_requests_total{job=\"text-to-speech\",status=~\"[45]..\"}[1h])))",
                "legendFormat": "{{status}}",
                "interval": "1h",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "decimals": 0,
                "noValue": "0",
                "custom": {
                  "drawStyle": "bars",
                  "barAlignment": 0,
                  "fillOpacity": 80,
                  "stacking": { "mode": "normal" }
                },
                "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] },
                "color": { "mode": "fixed", "fixedColor": "red" }
              }
            }
          }
        ],
        "schemaVersion": 39
      }
