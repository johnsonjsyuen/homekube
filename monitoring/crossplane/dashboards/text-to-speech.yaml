apiVersion: oss.grafana.crossplane.io/v1alpha1
kind: Dashboard
metadata:
  name: text-to-speech
spec:
  forProvider:
    folderRef:
      name: homekube
    configJson: |
      {
        "title": "Text-to-Speech",
        "uid": "homekube-tts",
        "tags": ["homekube", "tts"],
        "timezone": "browser",
        "refresh": "30s",
        "time": { "from": "now-1h", "to": "now" },
        "panels": [
          {
            "id": 1,
            "title": "Active Jobs",
            "type": "gauge",
            "gridPos": { "h": 8, "w": 6, "x": 0, "y": 0 },
            "targets": [
              {
                "expr": "tts_active_jobs",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "min": 0,
                "max": 10,
                "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 5 }, { "color": "red", "value": 8 }] }
              }
            }
          },
          {
            "id": 2,
            "title": "Jobs by Status",
            "type": "timeseries",
            "gridPos": { "h": 8, "w": 18, "x": 6, "y": 0 },
            "targets": [
              {
                "expr": "sum by (status) (rate(tts_jobs_total[5m]))",
                "legendFormat": "{{status}}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "custom": { "fillOpacity": 20, "stacking": { "mode": "normal" } },
                "unit": "ops"
              }
            }
          },
          {
            "id": 3,
            "title": "Generation Duration",
            "type": "timeseries",
            "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
            "targets": [
              {
                "expr": "histogram_quantile(0.50, sum by (le) (rate(tts_generation_duration_seconds_bucket[5m])))",
                "legendFormat": "p50",
                "refId": "A"
              },
              {
                "expr": "histogram_quantile(0.95, sum by (le) (rate(tts_generation_duration_seconds_bucket[5m])))",
                "legendFormat": "p95",
                "refId": "B"
              },
              {
                "expr": "histogram_quantile(0.99, sum by (le) (rate(tts_generation_duration_seconds_bucket[5m])))",
                "legendFormat": "p99",
                "refId": "C"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "s",
                "custom": { "fillOpacity": 10 }
              }
            }
          },
          {
            "id": 4,
            "title": "HTTP Request Rate",
            "type": "timeseries",
            "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
            "targets": [
              {
                "expr": "sum by (status) (rate(axum_http_requests_total{job=\"text-to-speech\"}[5m]))",
                "legendFormat": "{{status}}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "reqps",
                "custom": { "fillOpacity": 20, "stacking": { "mode": "normal" } }
              }
            }
          },
          {
            "id": 5,
            "title": "HTTP Latency p95",
            "type": "timeseries",
            "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum by (le, endpoint) (rate(axum_http_request_duration_seconds_bucket{job=\"text-to-speech\"}[5m])))",
                "legendFormat": "{{endpoint}}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "s",
                "custom": { "fillOpacity": 10 }
              }
            }
          }
        ],
        "schemaVersion": 39
      }
