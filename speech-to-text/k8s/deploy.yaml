apiVersion: apps/v1
kind: Deployment
metadata:
  name: speech-to-text
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speech-to-text
  template:
    metadata:
      labels:
        app: speech-to-text
    spec:
      initContainers:
      - name: check-model-version
        image: busybox:1.36
        env:
        - name: MODEL_VERSION
          value: "large-v3-turbo-1"
        command: ['sh', '-c']
        args:
        - |
          STAMP="/models/.version"
          if [ -f "$STAMP" ] && [ "$(cat "$STAMP")" = "$MODEL_VERSION" ]; then
            echo "Model cache at version $MODEL_VERSION, skipping"
          else
            echo "Model version changed to $MODEL_VERSION, clearing cache..."
            rm -rf /models/huggingface
            echo "$MODEL_VERSION" > "$STAMP"
          fi
        volumeMounts:
        - name: models
          mountPath: /models
      containers:
      # Rust WebSocket proxy
      - name: speech-to-text
        image: localhost:5000/speech-to-text:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: ws
        env:
        - name: KEYCLOAK_URL
          value: "http://keycloak.keycloak.svc.cluster.local"
        - name: KEYCLOAK_REALM
          value: "homekube"
        - name: KEYCLOAK_AUDIENCE
          value: "stt"
        - name: WHISPER_URL
          value: "http://localhost:8000"
        - name: RUST_LOG
          value: "info"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      # Whisper sidecar for transcription
      - name: whisper
        image: localhost:5000/speech-to-text-whisper:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: CPU_THREADS
          value: "4"
        - name: MODEL_PATH
          value: "large-v3-turbo"
        - name: HF_HOME
          value: "/models/huggingface"
        volumeMounts:
        - name: models
          mountPath: /models
        resources:
          requests:
            memory: "3Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "4"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 30
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: speech-to-text-models
