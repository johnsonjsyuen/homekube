apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-workflow-test
  namespace: temporal
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: test
          image: python:3.12-slim
          command:
            - sh
            - -c
            - |
              pip install temporalio --quiet &&
              python /test/test_workflow.py
          volumeMounts:
            - name: test-script
              mountPath: /test
      volumes:
        - name: test-script
          configMap:
            name: temporal-test-script
