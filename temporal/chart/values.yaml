# -----------------------------------------------------------
# CNPG PostgreSQL Cluster
# Prerequisite: CNPG operator must be installed in the cluster.
# If you change cnpg.name, you must also update the host and
# existingSecret fields under temporal.server.config.persistence.
# -----------------------------------------------------------
cnpg:
  name: temporal-db
  instances: 1
  storage:
    size: 2Gi
  monitoring:
    enablePodMonitor: true
  bootstrap:
    database: temporal
    owner: temporal
    postInitSQL:
      - CREATE DATABASE temporal_visibility OWNER temporal;

# -----------------------------------------------------------
# Temporal subchart values (passed to temporal/temporal chart)
# -----------------------------------------------------------
temporal:
  fullnameOverride: temporal

  server:
    config:
      numHistoryShards: 128
      persistence:
        defaultStore: default
        default:
          driver: "sql"
          sql:
            driver: "postgres12"
            host: "temporal-db-rw"
            port: 5432
            database: "temporal"
            user: "temporal"
            password: "unused"
            existingSecret: "temporal-db-app"
            maxConns: 20
            maxIdleConns: 20
            maxConnLifetime: "1h"
        visibility:
          driver: "sql"
          sql:
            driver: "postgres12"
            host: "temporal-db-rw"
            port: 5432
            database: "temporal_visibility"
            user: "temporal"
            password: "unused"
            existingSecret: "temporal-db-app"
            maxConns: 10
            maxIdleConns: 10
            maxConnLifetime: "1h"

  cassandra:
    enabled: false
  elasticsearch:
    enabled: false
  prometheus:
    enabled: false
  grafana:
    enabled: false

  schema:
    createDatabase:
      enabled: false
    setup:
      enabled: true
      backoffLimit: 100
    update:
      enabled: true
      backoffLimit: 100

  web:
    enabled: true
  admintools:
    enabled: true
